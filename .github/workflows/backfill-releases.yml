name: Backfill GitHub Releases

# Reconcile the Releases page with the tags: create a Release, from its CHANGELOG
# section, for every `v*` tag that has one but no Release yet. Idempotent -- tags
# that already have a Release are left untouched -- so it's safe to re-run any
# time the two drift apart. This is the one-time catch-up for v0.3.0..v0.6.0 and
# a repair button thereafter; ongoing releases are minted by deploy.yml on tag push.
#
# Run it from the Actions tab (Run workflow) or `gh workflow run backfill-releases.yml`.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create Releases for tags missing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created=0
          for tag in $(git tag --list 'v[0-9]*' | sort -V); do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "= $tag: already has a Release, skipping"
              continue
            fi
            if ! node scripts/changelog-extract.mjs "$tag" > release-notes.md 2>/dev/null; then
              echo "! $tag: no CHANGELOG section, skipping"
              continue
            fi
            gh release create "$tag" \
              --title "$tag" \
              --notes-file release-notes.md \
              --verify-tag
            echo "+ $tag: Release created"
            created=$((created + 1))
          done
          echo "Backfill done: $created Release(s) created."
