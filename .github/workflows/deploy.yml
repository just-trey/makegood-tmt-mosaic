name: Deploy to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        # Set this as a repo Variable (Settings → Secrets and variables → Actions →
        # Variables). Forks don't inherit it, so their deploys ship without the beacon.
        env:
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A git tag ships the site (the trigger above) but is not a GitHub Release.
  # This mints the Release from the tag's CHANGELOG section, so the tag push
  # stays the single go-live action and the Releases page can't drift behind the
  # tags again (it did: releases stopped at v0.2.1 while tags reached v0.6.0).
  # Gated on `build` so a Release is never published for a tag that fails tests.
  # Only fires for real tag pushes -- a manual workflow_dispatch redeploy makes
  # no Release. Backfilling existing tags is backfill-releases.yml.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/changelog-extract.mjs "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
