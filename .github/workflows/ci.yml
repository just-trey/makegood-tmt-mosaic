name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Fast lane: no browser needed, so it returns lint/type/test results in seconds
  # instead of waiting behind the browser-based smoke test. Runs in parallel with `smoke`.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:copy
      - run: npm run typecheck
      # Coverage rather than plain `npm test`: same suite, one run, plus the per-directory
      # coverage floors in vite.config.ts. A breach fails this step with an
      # "ERROR: Coverage for ... does not meet ... threshold" line, not a test failure.
      - run: npm run test:coverage

  # Browser lane: the official Playwright image ships the browsers and all system
  # libraries pre-installed, so there's no `playwright install` / apt download step.
  # The image tag MUST match the pinned playwright version in package.json (1.61.1) —
  # bump both together on upgrade, or the baked browsers won't match the client.
  smoke:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run smoke
        # A placeholder, never posted to: it exists so the build under smoke renders the feedback
        # widget at all. Left unset, every gate ran the fork path with the markup dead, and the
        # tagged deploy would have been the first time any of it painted.
        env:
          FEEDBACK_ENDPOINT: https://example.invalid/f/ci
