<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMT Inlay</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%236d93ff'/><circle cx='16' cy='16' r='6' fill='%23071022'/></svg>" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><img src="./brand/makegood-logo.png" alt="" /><span>TMT Inlay</span><span class="tag">beta</span></div>
        <div id="status" class="status" aria-live="polite"><span class="status-text">Loading</span><span class="status-bar"><span class="status-fill"></span></span></div>
        <button id="btn-help" class="btn small">Help</button>
      </header>
      <div id="restore-bar" class="restore" hidden>
        <span>You have a saved session from <span id="restore-when"></span>. Bring it back?</span>
        <button id="btn-restore" class="btn primary small">Restore</button>
        <button id="btn-fresh" class="btn small">Start fresh</button>
      </div>
      <aside id="panel" class="panel"></aside>
      <main id="viewport" class="viewport">
        <canvas id="gl"></canvas>
        <div id="viewport-hint" class="hint"></div>
      </main>
      <dialog id="help" class="help"></dialog>
    </div>
    <div id="narrow">This tool needs a window at least 900 px wide. Make the window bigger, or use a laptop or desktop.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
