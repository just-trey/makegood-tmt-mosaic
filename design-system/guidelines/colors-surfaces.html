<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="../styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: var(--bg);
        font-family: var(--mono);
        font-size: var(--text-meta);
        color: var(--text-dim);
        padding: var(--space-section);
        box-sizing: border-box;
        display: flex;
        gap: var(--space-row);
      }
      .sw {
        flex: 1;
        height: 90px;
        border-radius: 6px;
        border: 1px solid var(--line);
        display: flex;
        align-items: flex-end;
        padding: var(--space-tight);
      }
    </style>
  </head>
  <body>
    <div class="sw" style="background: var(--bg)">--bg</div>
    <div class="sw" style="background: var(--panel)">--panel</div>
    <div class="sw" style="background: var(--panel-2)">--panel-2</div>
    <div class="sw" style="background: var(--viewport)">--viewport</div>
  </body>
</html>
