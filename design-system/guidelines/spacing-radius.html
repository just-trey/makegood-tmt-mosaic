<!-- @dsCard group="Spacing" viewport="700x180" subtitle="Spacing scale and corner radii" name="Spacing & radius" -->
<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="../styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: var(--panel);
        padding: var(--space-section);
        box-sizing: border-box;
        font-family: var(--mono);
        font-size: var(--text-meta);
        color: var(--text-dim);
        display: flex;
        flex-direction: column;
        gap: var(--space-section);
      }
      .row {
        display: flex;
        align-items: center;
        gap: var(--space-row);
      }
      .bar {
        background: var(--accent);
        height: 10px;
        border-radius: 2px;
      }
      .rad {
        width: 44px;
        height: 44px;
        background: var(--panel-2);
        border: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="bar" style="width: var(--space-hair)"></div>
      2 · hair — optical nudge only
    </div>
    <div class="row">
      <div class="bar" style="width: var(--space-tight)"></div>
      4 · tight — inside a control: label-to-input, icon-to-text
    </div>
    <div class="row">
      <div class="bar" style="width: var(--space-row)"></div>
      8 · row — between rows within a panel
    </div>
    <div class="row">
      <div class="bar" style="width: var(--space-section)"></div>
      16 · section — between labelled groups inside a panel
    </div>
    <div class="row">
      <div class="bar" style="width: var(--space-panel)"></div>
      24 · panel — between panels
    </div>
    <div class="row" style="gap: var(--space-section)">
      <div class="rad" style="border-radius: 4px"></div>
      <div class="rad" style="border-radius: 6px"></div>
      <div class="rad" style="border-radius: 8px"></div>
    </div>
  </body>
</html>
