<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="../styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: var(--panel);
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-dim);
        padding: 16px;
        box-sizing: border-box;
        display: flex;
        gap: 10px;
      }
      .sw {
        flex: 1;
        height: 90px;
        border-radius: 6px;
        display: flex;
        align-items: flex-end;
        padding: 8px;
        color: #0d1a1a;
      }
    </style>
  </head>
  <body>
    <div class="sw" style="background: var(--accent)">--accent</div>
    <div class="sw" style="background: var(--accent-2)">--accent-2</div>
    <div class="sw" style="background: var(--danger); color: #1a0d0d">--danger</div>
  </body>
</html>
