<!-- @dsCard group="Type" viewport="700x260" subtitle="Text sizes in use, sans family" name="Type scale" -->
<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="../styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: var(--panel);
        padding: var(--space-section);
        box-sizing: border-box;
        font-family: var(--sans);
        color: var(--text);
        display: flex;
        flex-direction: column;
        gap: var(--space-tight);
      }
      span {
        color: var(--text-dim);
        font-family: var(--mono);
        font-size: var(--text-meta);
        margin-right: var(--space-row);
      }
    </style>
  </head>
  <body>
    <div style="font-family: var(--heading); font-size: var(--text-display); font-weight: 600">
      <span>20 / display</span>Mosaic — wordmark only
    </div>
    <div style="font-family: var(--heading); font-size: var(--text-emphasis)">
      <span>16 / emphasis</span>Dialog titles, empty states — the one size above body, used rarely
    </div>
    <div style="font-size: var(--text-body)">
      <span>12 / body</span>Everything else: control labels, inputs, buttons, help prose
    </div>
    <div
      style="
        font-family: var(--heading);
        font-size: var(--text-label);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
      "
    >
      <span>11 / label</span>SECTION LABEL — only size below body
    </div>
    <div style="font-family: var(--mono); font-size: var(--text-meta)">
      <span>11 / meta</span>Mono only — tris counts, hex, filenames, HUD, version
    </div>
  </body>
</html>
