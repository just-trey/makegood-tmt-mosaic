<html>

    <div><span>12 / md</span>Field labels, buttons</div>
    <div><span>11 / sm</span>Hints, hex values</div>
    <div style="text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700">
      <span>10.5 / xs</span>SECTION LABEL
